name: Release

# Either push a v* tag that matches the manifest version, or run this workflow
# manually ("Run workflow" on main) to tag the current commit with the
# manifest version and publish the release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Work out the release tag
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/frankston_bins/manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match manifest version $VERSION"; exit 1; }
          else
            test "$GITHUB_REF_NAME" = "main" || { echo "Manual releases must be run on main"; exit 1; }
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in manifest.json first"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
